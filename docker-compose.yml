services:
  portfolio-home:
    build: .
    container_name: portfolio-home
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./logs:/var/log/nginx

  portfolio-stats:
    image: nginx:1.27-alpine
    container_name: portfolio-stats
    restart: unless-stopped
    profiles:
      - dev
    ports:
      - "127.0.0.1:8092:80"
    volumes:
      - ./stats:/usr/share/nginx/html:ro

  portfolio-goaccess:
    image: allinurl/goaccess:latest
    container_name: portfolio-goaccess
    restart: unless-stopped
    profiles:
      - dev
    ports:
      - "127.0.0.1:7890:7890"
    volumes:
      - ./logs:/logs:ro
      - ./stats:/stats
    command:
      - /logs/access.log
      - --log-format=COMBINED
      - --real-time-html
      - --addr=0.0.0.0
      - --port=7890
      - --ws-url=ws://127.0.0.1:7890
      - -o
      - /stats/report.html
