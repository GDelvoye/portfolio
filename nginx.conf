log_format forwarded_combined '$remote_addr - $remote_user [$time_local] "$request" '
                              '$status $body_bytes_sent "$http_referer" '
                              '"$http_user_agent" '
                              'xff="$http_x_forwarded_for" realip="$realip_remote_addr"';

server {
    listen 80;
    server_name _;

    set_real_ip_from 172.29.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log combined;
    access_log /var/log/nginx/access-debug.log forwarded_combined;
    error_log /var/log/nginx/error.log warn;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
